;==========================================================
;
;   Polybar Configuration - Catppuccin Mocha Theme
;   with Icons (Font Awesome / Nerd Fonts)
;
;==========================================================

; ========== Catppuccin Mocha 配色 ==========
[colors]
rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
text = #cdd6f4
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
base = #1e1e2e
mantle = #181825
crust = #11111b
transparent = #FF00000

; ========== 状态栏配置 ==========
[bar/example]
width = 100%
height = 28pt
radius = 8

; 颜色引用
background = ${colors.base}
foreground = ${colors.text}
module-background = ${colors.surface0}

; 边框
line-size = 2pt
border-size = 0
border-color = #00000000

; 内边距与间距
padding-left = 2
padding-right = 2
module-margin = 2

; 分隔符
separator = " "
separator-foreground = ${colors.surface1}

; ========== 字体配置 ==========
; 方案A: 已有 Maple Mono NF CN (自带图标)
font-0 = "Maple Mono NF CN:size=11;2"

; 方案B: 如需更好的图标显示，可添加专用图标字体（可选，需安装）
; font-0 = "Maple Mono NF CN:size=11;2"
; font-1 = "Symbols Nerd Font Mono:size=14"

; ========== 模块配置 ==========
modules-left = xworkspaces xwindow
modules-center = 
modules-right = filesystem memory cpu pulseaudio xkeyboard wlan eth date

; 鼠标交互
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ========== 模块定义 ==========

[module/systray]
type = internal/tray
format-margin = 4
tray-spacing = 8

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.surface1}
label-active-underline = ${colors.blue}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = 󰈹 %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted = 󰋊 %{F#89b4fa}%mountpoint%%{F-} %percentage_used%%
label-unmounted = 󰋊 %mountpoint% not mounted
label-unmounted-foreground = ${colors.overlay0}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.text}

format-volume-prefix-foreground = ${colors.blue}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.overlay0}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = 󰌌 %layout%
label-layout-foreground = ${colors.blue}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.base}
label-indicator-background = ${colors.teal}

[module/memory]
type = internal/memory
interval = 2
format-prefix = ""
format-prefix-foreground = ${colors.blue}
label = 󰍛 %percentage_used:2%%
label-foreground = ${colors.text}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = ""
format-prefix-foreground = ${colors.blue}
label = 󰻠 %percentage:2%%
label-foreground = ${colors.text}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = 󰤮 %{F#89b4fa}%ifname%%{F#6c7086} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = 󰖩 %{F#89b4fa}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󰈀 %{F#89b4fa}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = 󰃰 %date%
label-foreground = ${colors.blue}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini