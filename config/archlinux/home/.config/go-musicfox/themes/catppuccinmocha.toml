backButton = "#d20f39"
backButtonHover = "#df8e1d"
subtitle = "#6c6c6c"
progressEmpty = "#ccd0da"
scrollTrack = "#ccd0da"
scrollThumb = "#acb0be"
button = "#1e66f5"
buttonBlurred = "#9ca0b0"

[light.popup]
