text = "#4c4f69"
breadcrumb = "#1e66f5"
breadcrumbSep = "#9ca0b0"
breadcrumbHover = "#8839ef"
breadcrumbClick = "#dc8a78"
time = "#6c6c6c"
nugget = "#4c4f69"
