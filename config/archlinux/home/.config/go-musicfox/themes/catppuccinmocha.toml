secondary = "#6c6c6c"
accent = "#1e66f5"
success = "#40a02b"
warning = "#df8e1d"
error = "#d20f39"
info = "#209fb5"
muted = "#9ca0b0"
hintKey = "#acb0be"
background = "#eff1f5"
foreground = "#4c4f69"
border = "#ccd0da"
surface = "#e6e9ef"

