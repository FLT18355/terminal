# Catppuccin Mocha - Go-Musicfox Theme
name = "Catppuccin Mocha"
description = "Catppuccin Mocha theme for go-musicfox"

# ── Dark Variant ───────────────────────────────────────────
[dark]
primary = "#cba6f7"       # 主色: 淡紫
secondary = "#bac2de"     # 次级文字: 灰蓝
accent = "#89b4fa"        # 强调色: 蓝
success = "#a6e3a1"       # 成功: 绿
warning = "#f9e2af"       # 警告: 黄
error = "#f38ba8"         # 错误: 红
info = "#89dceb"          # 信息: 天蓝
muted = "#6c7086"         # 静音: 深灰紫
hintKey = "#585b70"       # 提示键: 暗灰
background = "#1e1e2e"    # 背景: 深蓝黑
foreground = "#cdd6f4"    # 前景: 白
border = "#313244"        # 边框: 灰
surface = "#2e2e3e"       # 表面: 略亮

[dark.highlights]
menuTitle = "#a6e3a1"
menuItem = "#cdd6f4"
selectedItem = "#cba6f7"
selectedItemBg = "#313244"
menuItemHover = "#94e2d5"
selectedItemHover = "#f5c2e7"
title = "#f5e0dc"
prompt = "#89b4fa"
backButton = "#f38ba8"
backButtonHover = "#f9e2af"
subtitle = "#bac2de"
progressEmpty = "#313244"
scrollTrack = "#313244"
scrollThumb = "#585b70"
button = "#89b4fa"
buttonBlurred = "#6c7086"

[dark.popup]
surface = "#313244"
border = "#45475a"

[dark.notification]
surface = "#313244"
infoBorder = "#89b4fa"
successBorder = "#a6e3a1"
warningBorder = "#f9e2af"
errorBorder = "#f38ba8"

[dark.statusBar]
bar = "#1e1e2e"
text = "#cdd6f4"
breadcrumb = "#89b4fa"
breadcrumbSep = "#6c7086"
breadcrumbHover = "#cba6f7"
breadcrumbClick = "#f5e0dc"
time = "#bac2de"
nugget = "#cdd6f4"
nuggetLabel = "#45475a"

[dark.markdown]
dark = "dark"
light = "light"

[dark.app]
lyricActive = "#89dceb"
lyricTransition = "#cba6f7"
lyricInactive = "#6c7086"
lyricHighlight = "#f5e0dc"
playbarMode = "#cba6f7"
playbarVolume = "#89b4fa"
playbarPlaying = "#a6e3a1"
playbarPaused = "#f9e2af"
playbarHeartLiked = "#f38ba8"
playbarHeartUnliked = "#6c7086"
playbarArtist = "#9399b2"
visualizerColorStart = "random"
visualizerColorEnd = "random"
background = "#1e1e2e"
contextMenuBg = "#313244"
contextMenuBorder = "#45475a"
spectrumVerticalBg = "#1e1e2e"
desktopLyricsBg = "#1e1e2e"
loginError = "#f38ba8"
loginSuccess = "#a6e3a1"
authStatus = "#89b4fa"
configTableBorder = "#45475a"
configTableSelectedFg = "#cba6f7"
configTableSelectedBg = "#313244"

# ── Light Variant ──────────────────────────────────────────
# 如需亮色版可另行配置，这里保留基础结构
[light]
